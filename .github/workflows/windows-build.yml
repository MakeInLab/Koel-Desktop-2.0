name: Windows validation and Setup/Portable
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Install project dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
      - name: Typecheck and regression tests
        shell: pwsh
        run: |
          npm run typecheck
          npm test
      - name: Install NSIS compiler (outside npm dependency tree)
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build unsigned Setup and Portable
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Koel-Desktop-Windows-unsigned
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
