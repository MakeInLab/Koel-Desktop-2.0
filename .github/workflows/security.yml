name: Dependency audit
on:
  schedule:
    - cron: '13 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      # Install a real dependency tree and lockfile. Electron's binary is
      # unnecessary to perform a dependency audit in this job.
      - name: Resolve dependency tree
        run: npm install --ignore-scripts
      - name: Full dependency report
        run: node scripts/audit-dependencies.mjs --strict
        continue-on-error: true
      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-dependency-audit
          path: audit-reports/
          if-no-files-found: warn
      - name: Fail on high production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
